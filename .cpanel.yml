---
# ---------------------------------------------------------------------
# Publicação automática no cPanel
#
# Usado pelo Git Version Control do cPanel:
#   Manage → Pull or Deploy → Update from Remote → Deploy HEAD Commit
#
# ALTERE DEPLOYPATH se a aplicação não ficar na raiz do domínio.
# Exemplos:
#   raiz do domínio      /home/planeamentostx/public_html
#   subpasta             /home/planeamentostx/public_html/plataforma
#   subdomínio           /home/planeamentostx/planeamento.dominio.pt
# ---------------------------------------------------------------------
deployment:
  tasks:
    - export DEPLOYPATH=/home/planeamentostx/public_html

    # 1. Copia a aplicação. O glob * não apanha ficheiros ocultos na raiz,
    #    mas os .htaccess dentro de lib/ e storage/ vão junto com as
    #    respetivas pastas na cópia recursiva.
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R ./* $DEPLOYPATH/

    # 2. O .htaccess da raiz tem de ser copiado à parte (força HTTPS e
    #    protege o config.php). Sem esta linha o site fica exposto.
    - /bin/cp -f ./.htaccess $DEPLOYPATH/.htaccess

    # 3. Pastas de dados. O config.php e os ficheiros das aplicações já
    #    existentes NÃO são tocados: a cópia só sobrepõe ficheiros com o
    #    mesmo nome.
    - /bin/mkdir -p $DEPLOYPATH/storage/apps
    - /bin/chmod 750 $DEPLOYPATH/storage $DEPLOYPATH/storage/apps

    # 4. Restos da versão anterior (módulo de planeamento de obras). O cp
    #    acima sobrepõe ficheiros mas nunca apaga os que deixaram de
    #    existir no repositório — sem esta limpeza continuariam acessíveis
    #    no servidor e a dar erro 500, por já não terem tabelas na BD.
    - /bin/rm -rf $DEPLOYPATH/api $DEPLOYPATH/legacy
    - /bin/rm -f $DEPLOYPATH/admin/lists.php $DEPLOYPATH/admin/import.php $DEPLOYPATH/admin/backup.php
    - /bin/rm -f $DEPLOYPATH/lib/lists.php $DEPLOYPATH/lib/backup.php $DEPLOYPATH/lib/xlsx.php

    # 5. Depois da instalação estar concluída, o assistente deixa de ser
    #    publicado — para não voltar a aparecer a cada deploy.
    - /bin/sh -c 'if [ -f "$DEPLOYPATH/storage/.installed" ]; then rm -rf "$DEPLOYPATH/install"; fi'

    # 6. Protege o ficheiro de configuração, se já tiver sido criado.
    - /bin/sh -c 'if [ -f "$DEPLOYPATH/config.php" ]; then chmod 640 "$DEPLOYPATH/config.php"; fi'
